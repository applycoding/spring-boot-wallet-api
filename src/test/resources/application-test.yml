spring:
  datasource:
    url: jdbc:h2:mem:ledger;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

ledger:
  jwt:
    secret: test-only-jwt-secret-key-32-bytes-min
    expiration: 1h

logging:
  level:
    root: warn
    com.applycoding.ledger: info
