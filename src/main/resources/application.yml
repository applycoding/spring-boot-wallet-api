spring:
  application:
    name: ledger-api
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: ledger
    password: ledger
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-big-decimal-as-plain: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

ledger:
  jwt:
    # Local demo default only. Override LEDGER_JWT_SECRET outside this repository.
    secret: ${LEDGER_JWT_SECRET:demo-only-secret-key-change-me-32b}
    expiration: 1h
